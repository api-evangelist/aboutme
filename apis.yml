aid: aboutme
name: About.me
description: About.me is a personal homepage and online-identity platform that lets anyone create
  a free, one-page website in minutes to showcase their work, links, bio, and story on a claimable
  about.me/username profile page. Founded in 2009 and acquired by Vistaprint (Cimpress) in 2013, the
  service has evolved to add an AI "Virtual Twin" that lets visitors chat with an AI version of the
  page owner to answer questions, capture leads into a CRM, and schedule appointments automatically.
  About.me offers free, Standard, and Pro tiers with custom-domain connection, portfolio media,
  Google Analytics, and branding controls. It does not currently expose a public developer API.
